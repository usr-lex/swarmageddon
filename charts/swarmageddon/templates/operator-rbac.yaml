# The operator is the trusted component (docs/design.md §11.3): it manages our
# CRDs, namespaces and the kinds below in the namespaces it creates. RBAC
# can't scope a ClusterRole to labelled namespaces, so this is cluster-wide;
# no wildcards.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarmageddon-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmageddon-operator
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
# files/operator-rules.yaml is config/rbac/role.yaml, generated from the
# +kubebuilder:rbac markers in internal/operator (make manifests).
rules:
{{ .Files.Get "files/operator-rules.yaml" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarmageddon-operator
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swarmageddon-operator
subjects:
  - kind: ServiceAccount
    name: swarmageddon-operator
    namespace: {{ .Release.Namespace }}
