# The operator is the trusted component (docs/design.md §11.3): it manages our
# CRDs, namespaces and the kinds below in the namespaces it creates. RBAC
# can't scope a ClusterRole to labelled namespaces, so this is cluster-wide;
# no wildcards.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarmageddon-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmageddon-operator
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
rules:
  # Our resources.
  - apiGroups: ["swarmageddon.dev"]
    resources: [platforms, workspaces, rooms, roletemplates, runnerpools]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["swarmageddon.dev"]
    resources:
      - platforms/status
      - workspaces/status
      - rooms/status
      - roletemplates/status
      - runnerpools/status
      - platforms/finalizers
      - workspaces/finalizers
      - rooms/finalizers
      - runnerpools/finalizers
    verbs: [get, update, patch]
  # Namespaces it creates and labels swarmageddon.dev/managed=true.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  # Managed kinds.
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, persistentvolumeclaims, pods, resourcequotas, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Granted on to the control center in workspace namespaces (RBAC requires
  # the operator to hold what it grants).
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["apps"]
    resources: [statefulsets, deployments, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # Preflight and exposure: read the cluster.
  - apiGroups: [""]
    resources: [nodes, endpoints]
    verbs: [get, list, watch]
  # Kubelet's stats summary (free node disk for RunnerPools' minFreeDiskGB).
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses, csidrivers]
    verbs: [get, list, watch]
  - apiGroups: ["node.k8s.io"]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  # Hostname and TLS through cert-manager, when it's installed.
  - apiGroups: ["cert-manager.io"]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["cert-manager.io"]
    resources: [issuers, clusterissuers]
    verbs: [get, list, watch]
  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarmageddon-operator
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swarmageddon-operator
subjects:
  - kind: ServiceAccount
    name: swarmageddon-operator
    namespace: {{ .Release.Namespace }}
