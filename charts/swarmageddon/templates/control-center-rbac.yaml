# The control center's own RBAC (docs/design.md §11.3). Its access inside
# workspace namespaces comes from RoleBindings the operator creates there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-center
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmageddon-control-center
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
rules:
  - apiGroups: ["swarmageddon.dev"]
    resources: [platforms, workspaces]
    verbs: [get, list, watch, create, update, patch]
  # platforms/status: claiming admin (status.adminClaimed).
  - apiGroups: ["swarmageddon.dev"]
    resources: [platforms/status]
    verbs: [get, patch]
  - apiGroups: ["swarmageddon.dev"]
    resources: [workspaces/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarmageddon-control-center
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swarmageddon-control-center
subjects:
  - kind: ServiceAccount
    name: control-center
    namespace: {{ .Release.Namespace }}
---
# Its own Secrets and ConfigMaps in the system namespace, by name (the
# fixed names of api/v1alpha1/controlcenter_names.go). `create` can't be
# limited by name in RBAC, so it may create Secrets and ConfigMaps here but
# read and change only these; the operator's Role control-center-owned adds
# the ones it created with a per-provider, per-channel or per-workspace
# name. Its certificates are mounted, not read through the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-center
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - setup-token
      - local-admin
      - control-center-session
      - control-center-db
      - vapid
      - control-center-saml
      - control-center-gateway
      - forge-reader
      - ntfy-publisher
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [platform-ca-bundle]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-center
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-center
subjects:
  - kind: ServiceAccount
    name: control-center
    namespace: {{ .Release.Namespace }}
