{{- if .Values.welcome.enabled }}
# Prints how to get in, for `kubectl apply` installs (docs/design.md §3.1):
#   kubectl -n {{ .Release.Namespace }} logs -f job/welcome
# `operator welcome` waits for Platform "default" to report status.url and for
# Secret setup-token, then prints the URL, the token, the CA fingerprint and a
# port-forward fallback. It may read only those two objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: welcome
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmageddon-welcome
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
rules:
  - apiGroups: ["swarmageddon.dev"]
    resources: [platforms]
    resourceNames: [default]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarmageddon-welcome
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swarmageddon-welcome
subjects:
  - kind: ServiceAccount
    name: welcome
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: welcome
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [setup-token]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: welcome
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: welcome
subjects:
  - kind: ServiceAccount
    name: welcome
    namespace: {{ .Release.Namespace }}
---
# A Job's pod template is immutable: re-applying install.yaml for an upgrade
# while this Job still exists fails for this object only. The TTL removes it
# an hour after it finishes.
apiVersion: batch/v1
kind: Job
metadata:
  name: welcome
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
    app.kubernetes.io/name: welcome
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: {{ .Values.welcome.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "swarmageddon.labels" . | nindent 8 }}
        app.kubernetes.io/name: welcome
    spec:
      serviceAccountName: welcome
      enableServiceLinks: false
      restartPolicy: OnFailure
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "swarmageddon.podSecurity" . | nindent 8 }}
      containers:
        - name: welcome
          image: {{ include "swarmageddon.image" (list . "operator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["welcome"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            {{- include "swarmageddon.containerSecurity" . | nindent 12 }}
{{- end }}
