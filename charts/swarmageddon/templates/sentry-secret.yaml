{{- if and .Values.sentry.dsn (not .Values.sentry.existingSecret) }}
# The Sentry DSN (values sentry.dsn). The operator and control center read it
# as SENTRY_DSN; the operator copies it into the platform namespace for
# messaging, the warden and egress.
apiVersion: v1
kind: Secret
metadata:
  name: sentry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarmageddon.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.sentry.dsn | quote }}
{{- end }}
