---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workspaces.swarmageddon.dev
spec:
  group: swarmageddon.dev
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forge.org
      name: Org
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace is a team of agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkspaceSpec is a team: its forge org, groups, messaging policy, models
              and notifications. The workspace owns the namespace ws-<name>.
            properties:
              allowedCIDRs:
                description: AllowedCIDRs rooms may reach even inside denied ranges
                  (e.g. a model server on the LAN).
                items:
                  type: string
                type: array
              approvalTimeout:
                description: ApprovalTimeout after which an unanswered approval leaves
                  the inbox. Default 24h.
                type: string
              deletedRoomRetention:
                description: DeletedRoomRetention keeps a removed room's volumes this
                  long. Default 168h.
                type: string
              displayName:
                type: string
              forge:
                properties:
                  org:
                    description: Org is the Forgejo organization the workspace's agents
                      work in.
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                    type: string
                  requiredApprovals:
                    default: 1
                    format: int32
                    type: integer
                  signedCommits:
                    default: true
                    type: boolean
                  teams:
                    description: Extra teams and their members (room names). Built-in
                      teams come from role templates.
                    items:
                      properties:
                        members:
                          items:
                            type: string
                          type: array
                        name:
                          type: string
                        permission:
                          default: write
                          description: TeamPermission is a Forgejo team permission.
                          enum:
                          - read
                          - write
                          - admin
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                required:
                - org
                type: object
              groups:
                items:
                  properties:
                    description:
                      type: string
                    name:
                      pattern: ^[a-z][a-z0-9-]*$
                      type: string
                  required:
                  - name
                  type: object
                type: array
              internet:
                default: true
                description: 'Room egress: false cuts rooms off from the internet;
                  platform services stay reachable.'
                type: boolean
              isolationTier:
                default: inherit
                type: string
              messaging:
                properties:
                  defaultLinks:
                    default: withinGroup
                    description: DefaultLinks is how rooms in the same group reach
                      each other.
                    enum:
                    - withinGroup
                    - none
                    type: string
                  humansReachable:
                    default: true
                    description: People with the operator role may message agents;
                      agents may message people.
                    type: boolean
                  limits:
                    properties:
                      maxBytes:
                        default: 65536
                        format: int32
                        type: integer
                      ratePerMinute:
                        default: 30
                        format: int32
                        type: integer
                    type: object
                  links:
                    description: Links between groups. "" names the default group
                      (rooms without a group).
                    items:
                      description: GroupLink lets messages flow one way, from one
                        group to another.
                      properties:
                        from:
                          type: string
                        mode:
                          description: LinkMode is how one group may reach another.
                          enum:
                          - open
                          - mediated
                          - none
                          type: string
                        recipients:
                          description: 'Mediated: only these rooms in To may receive.
                            Empty: anyone.'
                          items:
                            type: string
                          type: array
                        requirePrefix:
                          description: RequirePrefix the message must start with;
                            {recipient} is replaced by the recipient's name.
                          type: string
                        senders:
                          description: 'Mediated: only these rooms in From may send.
                            Empty: anyone.'
                          items:
                            type: string
                          type: array
                        to:
                          type: string
                      required:
                      - from
                      - mode
                      - to
                      type: object
                    type: array
                  retention:
                    description: RetentionSettings are TTLs; 0 keeps forever.
                    properties:
                      audit:
                        type: string
                      auditBodies:
                        default: true
                        description: AuditBodies keeps message bodies in the audit
                          log; false keeps metadata only.
                        type: boolean
                      messages:
                        type: string
                      transcripts:
                        type: string
                    type: object
                type: object
              models:
                properties:
                  budgets:
                    properties:
                      perRoomMonthlyUSD:
                        description: Monthly budget per room in USD; 0 is unlimited.
                        format: int32
                        type: integer
                    type: object
                  default:
                    type: string
                type: object
              notifications:
                properties:
                  channels:
                    items:
                      properties:
                        kind:
                          description: ChannelKind is a notification channel.
                          enum:
                          - webPush
                          - ntfy
                          - slack
                          - discord
                          - email
                          type: string
                        secretName:
                          description: Secret in the system namespace holding key
                            url (Slack, Discord) or smtp settings (email).
                          type: string
                        topic:
                          description: ntfy topic.
                          type: string
                      required:
                      - kind
                      type: object
                    type: array
                  events:
                    items:
                      description: NotificationEvent is something people get notified
                        about.
                      enum:
                      - approvalWaiting
                      - idleWithOpenWork
                      - ciRed
                      - budget
                      - diskLow
                      - roomCrashed
                      type: string
                    type: array
                type: object
              owners:
                description: Owners are control center users (by email or handle)
                  who operate this workspace.
                items:
                  type: string
                type: array
              repositories:
                items:
                  properties:
                    group:
                      description: 'Group whose team owns it; empty: the default teams.'
                      type: string
                    importURL:
                      description: ImportURL to clone from instead of creating an
                        empty repository.
                      type: string
                    mirrorSecretName:
                      type: string
                    name:
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                      type: string
                    pushMirror:
                      description: PushMirror to GitHub (or any git URL); credentials
                        from MirrorSecretName (key token).
                      type: string
                    statusChecks:
                      description: StatusChecks required on the default branch.
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
              updatePolicy:
                properties:
                  mode:
                    default: whenIdle
                    description: UpdateMode is when rooms move to a new image.
                    enum:
                    - whenIdle
                    - manual
                    - window
                    type: string
                  window:
                    description: Window, for mode window, e.g. "Sat 02:00-06:00" (UTC).
                    type: string
                type: object
            required:
            - forge
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespace:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
