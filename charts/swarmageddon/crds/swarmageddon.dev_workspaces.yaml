---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workspaces.swarmageddon.dev
spec:
  group: swarmageddon.dev
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forge.org
      name: Org
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace is a team of agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkspaceSpec is a team: its forge org, groups, messaging policy, models
              and notifications. The workspace owns the namespace ws-<name>.
            properties:
              allowedCIDRs:
                description: AllowedCIDRs rooms may reach even inside denied ranges
                  (e.g. a model server on the LAN).
                items:
                  type: string
                type: array
              approvalTimeout:
                description: ApprovalTimeout after which an unanswered approval leaves
                  the inbox. Default 24h.
                type: string
              deletedRoomRetention:
                description: DeletedRoomRetention keeps a removed room's volumes this
                  long. Default 168h.
                type: string
              displayName:
                type: string
              forge:
                properties:
                  org:
                    description: Org is the Forgejo organization the workspace's agents
                      work in.
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                    type: string
                  requiredApprovals:
                    default: 1
                    format: int32
                    type: integer
                  signedCommits:
                    default: true
                    type: boolean
                  teams:
                    description: Extra teams and their members (room names). Built-in
                      teams come from role templates.
                    items:
                      properties:
                        members:
                          items:
                            type: string
                          type: array
                        name:
                          type: string
                        permission:
                          default: write
                          description: TeamPermission is a Forgejo team permission.
                          enum:
                          - read
                          - write
                          - admin
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                required:
                - org
                type: object
              forgeNotifications:
                description: |-
                  ForgeNotifications lists the forge events delivered to agents as messages
                  (docs/design.md §9.7). Empty: all of them.
                items:
                  description: ForgeEvent is a kind of forge activity delivered to
                    agents.
                  enum:
                  - assigned
                  - reviewRequested
                  - mentioned
                  - reviewSubmitted
                  - commented
                  - ciFailed
                  type: string
                type: array
              groups:
                items:
                  properties:
                    description:
                      type: string
                    name:
                      pattern: ^[a-z][a-z0-9-]*$
                      type: string
                  required:
                  - name
                  type: object
                type: array
              internet:
                default: true
                description: 'Deprecated: use roomDefaults.network. false is the same
                  as network mode none.'
                type: boolean
              isolationTier:
                default: inherit
                type: string
              messaging:
                properties:
                  channels:
                    description: Channels are the workspace's one-to-many conversations
                      (docs/design.md §7.8).
                    items:
                      description: ChannelSpec is a named conversation and who may
                        read and post in it.
                      properties:
                        allowedDelivery:
                          description: 'AllowedDelivery lists the modes readers may
                            switch to. Empty: all.'
                          items:
                            description: DeliveryMode is how a channel's posts reach
                              a reader's session.
                            enum:
                            - push
                            - digest
                            - pull
                            type: string
                          type: array
                        defaultDelivery:
                          default: digest
                          description: DeliveryMode is how a channel's posts reach
                            a reader's session.
                          enum:
                          - push
                          - digest
                          - pull
                          type: string
                        description:
                          type: string
                        members:
                          items:
                            description: ChannelMember selects members and gives them
                              access.
                            properties:
                              access:
                                description: ChannelAccess is what a channel member
                                  may do.
                                enum:
                                - read
                                - write
                                - readWrite
                                type: string
                              select:
                                description: |-
                                  Selector: everyone, people, role:<template>, team:<forge team>,
                                  group:<group>, room:<name> or person:<handle>.
                                pattern: ^(everyone|people|(role|team|group|room|person):[a-z0-9][a-z0-9_-]{0,62})$
                                type: string
                            required:
                            - access
                            - select
                            type: object
                          minItems: 1
                          type: array
                        name:
                          description: 'Name without the leading #.'
                          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
                          type: string
                        postsPerMinute:
                          description: PostsPerMinute across all posters. Default
                            20.
                          format: int32
                          type: integer
                      required:
                      - members
                      - name
                      type: object
                    type: array
                  defaultLinks:
                    default: withinGroup
                    description: DefaultLinks is how rooms in the same group reach
                      each other.
                    enum:
                    - withinGroup
                    - none
                    type: string
                  humansReachable:
                    default: true
                    description: People with the operator role may message agents;
                      agents may message people.
                    type: boolean
                  limits:
                    properties:
                      maxBytes:
                        default: 65536
                        format: int32
                        type: integer
                      ratePerMinute:
                        default: 30
                        format: int32
                        type: integer
                    type: object
                  links:
                    description: Links between groups. "" names the default group
                      (rooms without a group).
                    items:
                      description: GroupLink lets messages flow one way, from one
                        group to another.
                      properties:
                        from:
                          type: string
                        mode:
                          description: LinkMode is how one group may reach another.
                          enum:
                          - open
                          - mediated
                          - none
                          type: string
                        recipients:
                          description: 'Mediated: only these rooms in To may receive.
                            Empty: anyone.'
                          items:
                            type: string
                          type: array
                        requirePrefix:
                          description: RequirePrefix the message must start with;
                            {recipient} is replaced by the recipient's name.
                          type: string
                        senders:
                          description: 'Mediated: only these rooms in From may send.
                            Empty: anyone.'
                          items:
                            type: string
                          type: array
                        to:
                          type: string
                      required:
                      - from
                      - mode
                      - to
                      type: object
                    type: array
                  retention:
                    description: RetentionSettings are TTLs; 0 keeps forever.
                    properties:
                      audit:
                        type: string
                      auditBodies:
                        default: true
                        description: AuditBodies keeps message bodies in the audit
                          log; false keeps metadata only.
                        type: boolean
                      messages:
                        type: string
                      transcripts:
                        type: string
                    type: object
                  storm:
                    description: Storm keeps agents' sessions from being flooded (docs/design.md
                      §7.8).
                    properties:
                      coalesceBytes:
                        description: CoalesceBytes caps one coalesced injection. Default
                          4096.
                        format: int32
                        type: integer
                      digestInterval:
                        description: DigestInterval between digest notices per channel.
                          Default 15m.
                        type: string
                      fanoutPerMinute:
                        description: FanoutPerMinute caps recipients a sender reaches
                          per minute. Default 60.
                        format: int32
                        type: integer
                      pushPerMinute:
                        description: PushPerMinute is how many items may be pushed
                          into a session per minute. Default 6.
                        format: int32
                        type: integer
                    type: object
                type: object
              models:
                properties:
                  budgets:
                    properties:
                      perRoomMonthlyUSD:
                        description: Monthly budget per room in USD; 0 is unlimited.
                        format: int32
                        type: integer
                    type: object
                  default:
                    type: string
                type: object
              notifications:
                properties:
                  channels:
                    items:
                      properties:
                        kind:
                          description: ChannelKind is a notification channel.
                          enum:
                          - webPush
                          - ntfy
                          - slack
                          - discord
                          - email
                          type: string
                        secretName:
                          description: Secret in the system namespace holding key
                            url (Slack, Discord) or smtp settings (email).
                          type: string
                        topic:
                          description: ntfy topic.
                          type: string
                      required:
                      - kind
                      type: object
                    type: array
                  events:
                    items:
                      description: NotificationEvent is something people get notified
                        about.
                      enum:
                      - approvalWaiting
                      - idleWithOpenWork
                      - ciRed
                      - budget
                      - diskLow
                      - roomCrashed
                      - wardenFlag
                      type: string
                    type: array
                type: object
              owners:
                description: Owners are control center users (by email or handle)
                  who operate this workspace.
                items:
                  type: string
                type: array
              repositories:
                items:
                  properties:
                    group:
                      description: 'Group whose team owns it; empty: the default teams.'
                      type: string
                    importURL:
                      description: ImportURL to clone from instead of creating an
                        empty repository.
                      type: string
                    mirrorSecretName:
                      type: string
                    name:
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                      type: string
                    pushMirror:
                      description: PushMirror to GitHub (or any git URL); credentials
                        from MirrorSecretName (key token).
                      type: string
                    statusChecks:
                      description: StatusChecks required on the default branch.
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
              roomDefaults:
                description: RoomDefaults apply to every room of the workspace (docs/design.md
                  §6.6).
                properties:
                  env:
                    additionalProperties:
                      type: string
                    description: Env adds non-secret environment variables.
                    type: object
                  mcpServers:
                    additionalProperties:
                      description: MCPServer is one MCP server, as in .mcp.json.
                      properties:
                        args:
                          items:
                            type: string
                          type: array
                        command:
                          type: string
                        disabled:
                          description: Disabled removes a server inherited from an
                            earlier level.
                          type: boolean
                        enabledTools:
                          description: 'EnabledTools limits the server''s tools; empty:
                            all.'
                          items:
                            type: string
                          type: array
                        env:
                          additionalProperties:
                            description: MCPValue is a literal value, or one taken
                              from a Secret.
                            properties:
                              value:
                                type: string
                              valueFrom:
                                description: SecretKeyRef names a key of a Secret
                                  in the workspace namespace.
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            type: object
                          type: object
                        headers:
                          additionalProperties:
                            description: MCPValue is a literal value, or one taken
                              from a Secret.
                            properties:
                              value:
                                type: string
                              valueFrom:
                                description: SecretKeyRef names a key of a Secret
                                  in the workspace namespace.
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            type: object
                          type: object
                        type:
                          description: stdio (default when command is set) or http.
                          enum:
                          - stdio
                          - http
                          type: string
                        url:
                          type: string
                      type: object
                    description: MCPServers for both CLIs, by name, in the .mcp.json
                      format.
                    type: object
                  network:
                    description: Network is the room's network access (docs/design.md
                      §11.2).
                    properties:
                      domains:
                        description: |-
                          Domains reachable in limited mode: exact hosts or *.suffix, with an
                          optional :port (default 443 and 80). Merged across levels.
                        items:
                          type: string
                        type: array
                      mode:
                        default: full
                        description: NetworkMode is how much network a room gets.
                        enum:
                        - none
                        - limited
                        - full
                        type: string
                      packageManagers:
                        description: PackageManagers adds the package registries'
                          domains in limited mode.
                        type: boolean
                    type: object
                  secretEnv:
                    description: |-
                      SecretEnv adds environment variables whose values come from Secrets in
                      the workspace namespace.
                    items:
                      description: SecretEnvVar is an environment variable whose value
                        comes from a Secret.
                      properties:
                        name:
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        secretRef:
                          description: SecretKeyRef names a key of a Secret in the
                            workspace namespace.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - name
                      - secretRef
                      type: object
                    type: array
                type: object
              sharedVolumes:
                description: SharedVolumes are ReadWriteMany volumes shared between
                  rooms.
                items:
                  description: |-
                    SharedVolume is a ReadWriteMany volume mounted into the rooms its mounts
                    select, at /srv/shared/<name> (docs/design.md §6.6).
                  properties:
                    mounts:
                      items:
                        description: VolumeMount selects rooms for a shared volume.
                        properties:
                          readOnly:
                            type: boolean
                          select:
                            description: 'Selector: everyone, role:<template>, group:<group>
                              or room:<name>.'
                            pattern: ^(everyone|(role|group|room):[a-z0-9][a-z0-9_-]{0,62})$
                            type: string
                        required:
                        - select
                        type: object
                      minItems: 1
                      type: array
                    name:
                      pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                      type: string
                    size:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    storageClassName:
                      type: string
                  required:
                  - mounts
                  - name
                  - size
                  type: object
                type: array
              updatePolicy:
                properties:
                  mode:
                    default: whenIdle
                    description: UpdateMode is when rooms move to a new image.
                    enum:
                    - whenIdle
                    - manual
                    - window
                    type: string
                  window:
                    description: Window, for mode window, e.g. "Sat 02:00-06:00" (UTC).
                    type: string
                type: object
              warden:
                description: Warden watches agents for drift and risky actions (ADR
                  0011).
                properties:
                  interruptOnHigh:
                    default: true
                    description: InterruptOnHigh interrupts the agent's turn on a
                      high-severity verdict.
                    type: boolean
                  mode:
                    default: monitor
                    description: WardenMode is how closely the warden watches.
                    enum:
                    - "off"
                    - monitor
                    - gate
                    type: string
                  model:
                    description: 'Model the warden judges with: a small, fast model
                      on the gateway. Empty: rules only.'
                    type: string
                  monthlyUSD:
                    description: Monthly budget of each room's warden key in USD.
                      Default 20.
                    format: int32
                    type: integer
                  quarantineOnHigh:
                    description: QuarantineOnHigh quarantines on high verdicts from
                      the gateway guard, not only critical ones.
                    type: boolean
                type: object
            required:
            - forge
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespace:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
