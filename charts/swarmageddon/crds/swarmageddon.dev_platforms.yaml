---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: platforms.swarmageddon.dev
spec:
  group: swarmageddon.dev
  names:
    kind: Platform
    listKind: PlatformList
    plural: platforms
    singular: platform
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.adminClaimed
      name: Admin
      type: boolean
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Platform is the installation. There is one, named "default".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'PlatformSpec is the installation: services, sign-in, hostname
              and TLS.'
            properties:
              auditRetention:
                description: Retention for the control center's audit log. 0 keeps
                  it forever.
                type: string
              auth:
                properties:
                  defaultRole:
                    description: DefaultRole for signed-in users no mapping matches.
                      Empty refuses them.
                    enum:
                    - admin
                    - operator
                    - viewer
                    type: string
                  local:
                    properties:
                      disabled:
                        description: Disabled turns off local accounts once an identity
                          provider works.
                        type: boolean
                    type: object
                  oidc:
                    items:
                      properties:
                        clientID:
                          type: string
                        clientSecretRef:
                          description: Secret in the system namespace with key clientSecret.
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                        displayName:
                          type: string
                        groupsClaim:
                          default: groups
                          type: string
                        issuer:
                          type: string
                        name:
                          description: Name shown on the sign-in page; also the provider's
                            ID in URLs.
                          pattern: ^[a-z0-9-]+$
                          type: string
                        scopes:
                          items:
                            type: string
                          type: array
                      required:
                      - clientID
                      - clientSecretRef
                      - issuer
                      - name
                      type: object
                    type: array
                  roleMappings:
                    description: RoleMappings map identity-provider groups to roles.
                      The highest matching role wins.
                    items:
                      properties:
                        group:
                          type: string
                        role:
                          description: Role is a control center role.
                          enum:
                          - admin
                          - operator
                          - viewer
                          type: string
                      required:
                      - group
                      - role
                      type: object
                    type: array
                  saml:
                    items:
                      properties:
                        displayName:
                          type: string
                        groupsAttribute:
                          default: groups
                          type: string
                        metadataConfigMapRef:
                          description: ConfigMap in the system namespace with key
                            metadata.xml.
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                        metadataURL:
                          type: string
                        name:
                          pattern: ^[a-z0-9-]+$
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
              egress:
                properties:
                  clusterCIDRs:
                    description: ClusterCIDRs overrides detection of the pod, service
                      and node ranges rooms may not reach.
                    items:
                      type: string
                    type: array
                  extraDeniedCIDRs:
                    description: ExtraDeniedCIDRs are also kept from rooms.
                    items:
                      type: string
                    type: array
                type: object
              hostname:
                description: |-
                  Hostname the control center (and Forgejo, under forge.<hostname>) is served on.
                  Empty: reach it by node IP, NodePort or port-forward.
                type: string
              isolationTier:
                default: auto
                description: IsolationTier is how rooms nest containers (ADR 0001).
                enum:
                - auto
                - userns
                - sysbox
                - privileged
                type: string
              privilegedAccepted:
                description: PrivilegedAccepted must be true for rooms to run privileged;
                  isolation does not hold then.
                type: boolean
              services:
                description: Services lists the platform services and their sizes.
                  Deployed once Wizard.ServicesApproved is set.
                properties:
                  forgejo:
                    properties:
                      oidcLogin:
                        description: OIDCLogin lets people sign in to Forgejo with
                          the first OIDC provider.
                        type: boolean
                      storage:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  gateway:
                    properties:
                      providers:
                        items:
                          properties:
                            apiKeySecretRef:
                              description: Secret in the platform namespace with key
                                apiKey. Optional for local servers.
                              properties:
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                            baseURL:
                              description: Base URL, for openaiCompatible (e.g. a
                                local vLLM) or a proxy.
                              type: string
                            kind:
                              description: ProviderKind is a model provider's API.
                              enum:
                              - anthropic
                              - openai
                              - openaiCompatible
                              type: string
                            models:
                              description: Models this provider serves, as the gateway
                                exposes them.
                              items:
                                type: string
                              type: array
                            name:
                              pattern: ^[a-z0-9-]+$
                              type: string
                          required:
                          - kind
                          - models
                          - name
                          type: object
                        type: array
                    type: object
                  messaging:
                    properties:
                      replicas:
                        description: Replicas; 0 picks 3, or 1 on a single-node cluster.
                        format: int32
                        type: integer
                      storage:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  ntfy:
                    properties:
                      enabled:
                        type: boolean
                      storage:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  postgres:
                    properties:
                      storage:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  registryCache:
                    properties:
                      storage:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      upstreams:
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              tls:
                properties:
                  issuerRef:
                    description: cert-manager issuer, when Mode is certManager.
                    properties:
                      kind:
                        default: ClusterIssuer
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    default: selfSigned
                    description: TLSMode chooses where the control center's certificate
                      comes from.
                    enum:
                    - selfSigned
                    - certManager
                    type: string
                type: object
              wizard:
                description: Wizard records how far the first-run wizard got, so it
                  can be resumed.
                properties:
                  servicesApproved:
                    description: ServicesApproved starts deploying the platform services.
                    type: boolean
                  step:
                    description: Step the wizard was on, for resuming.
                    type: string
                type: object
            type: object
          status:
            description: PlatformStatus is the operator's view of the installation.
            properties:
              adminClaimed:
                type: boolean
              caFingerprint:
                description: SHA-256 fingerprint of the control center's CA, to check
                  before typing the setup token.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              preflight:
                properties:
                  checks:
                    items:
                      properties:
                        fix:
                          description: What to do about a warning or failure.
                          type: string
                        message:
                          type: string
                        name:
                          type: string
                        result:
                          description: CheckResult is the outcome of one preflight
                            check.
                          enum:
                          - pass
                          - warn
                          - fail
                          - pending
                          type: string
                      required:
                      - name
                      - result
                      type: object
                    type: array
                  clusterCIDRs:
                    description: Detected ranges rooms may not reach.
                    items:
                      type: string
                    type: array
                  completedAt:
                    format: date-time
                    type: string
                  roomEstimate:
                    description: About how many rooms of the default size fit.
                    format: int32
                    type: integer
                  tier:
                    description: The isolation tier preflight chose (or the spec forced).
                    enum:
                    - auto
                    - userns
                    - sysbox
                    - privileged
                    type: string
                type: object
              preflightRerun:
                description: |-
                  PreflightRerun is the swarmageddon.dev/rerun-preflight annotation value
                  the operator last acted on; a different value runs preflight again.
                type: string
              url:
                description: URL the control center is reachable on, as far as the
                  operator can tell.
                type: string
              versions:
                additionalProperties:
                  type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
