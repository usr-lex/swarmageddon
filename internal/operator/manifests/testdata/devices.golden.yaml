---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: privileged
    swarmageddon.dev/component: devices
  name: swarmageddon-devices
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: devices
    swarmageddon.dev/component: devices
  name: devices
  namespace: swarmageddon-devices
spec:
  selector:
    matchLabels:
      swarmageddon.dev/component: devices
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devices
        swarmageddon.dev/component: devices
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --dir=/var/lib/kubelet/device-plugins
        - --host-root=/host
        image: ghcr.io/usr-lex/swarmageddon/devices:v0.1.0
        name: devices
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugins
        - mountPath: /host/dev
          name: dev
          readOnly: true
      enableServiceLinks: false
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
        name: device-plugins
      - hostPath:
          path: /dev
          type: Directory
        name: dev
  updateStrategy:
    type: RollingUpdate
