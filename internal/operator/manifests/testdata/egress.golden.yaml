---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: egress
    swarmageddon.dev/component: egress
  name: egress
  namespace: swarmageddon-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: egress
    swarmageddon.dev/component: egress
  name: egress
  namespace: swarmageddon-platform
rules:
- apiGroups:
  - ""
  resourceNames:
  - egress-allowlist
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: egress
    swarmageddon.dev/component: egress
  name: egress
  namespace: swarmageddon-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress
subjects:
- kind: ServiceAccount
  name: egress
  namespace: swarmageddon-platform
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: egress
    swarmageddon.dev/component: egress
  name: egress
  namespace: swarmageddon-platform
spec:
  ports:
  - name: proxy
    port: 3128
    targetPort: 3128
  selector:
    swarmageddon.dev/component: egress
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/name: egress
    swarmageddon.dev/component: egress
  name: egress
  namespace: swarmageddon-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      swarmageddon.dev/component: egress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: egress
    swarmageddon.dev/component: egress
  name: egress
  namespace: swarmageddon-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      swarmageddon.dev/component: egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress
        swarmageddon.dev/component: egress
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  swarmageddon.dev/component: egress
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - --listen=:3128
        - --health=:8080
        - --namespace=swarmageddon-platform
        image: ghcr.io/usr-lex/swarmageddon/egress:v0.1.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 20
        name: egress
        ports:
        - containerPort: 3128
          name: proxy
        - containerPort: 8080
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      enableServiceLinks: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: egress
