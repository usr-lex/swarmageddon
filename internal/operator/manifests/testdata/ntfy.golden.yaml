---
apiVersion: v1
kind: Service
metadata:
  labels:
    swarmageddon.dev/component: ntfy
  name: ntfy
  namespace: swarmageddon-platform
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    swarmageddon.dev/component: ntfy
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    swarmageddon.dev/component: ntfy
  name: ntfy
  namespace: swarmageddon-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      swarmageddon.dev/component: ntfy
  serviceName: ntfy
  template:
    metadata:
      labels:
        swarmageddon.dev/component: ntfy
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - serve
        env:
        - name: NTFY_BASE_URL
          value: https://ntfy.example.com
        - name: NTFY_LISTEN_HTTP
          value: :8080
        - name: NTFY_CACHE_FILE
          value: /var/cache/ntfy/cache.db
        - name: NTFY_BEHIND_PROXY
          value: "true"
        image: docker.io/binwiederhier/ntfy:v2.31.0@sha256:803b2aaeb94df76c8b32ecd91039dc80b0fddb7041dcaf082b33bcdfd4ba39ad
        name: ntfy
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /v1/health
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/cache/ntfy
          name: data
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
