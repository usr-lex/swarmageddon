---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: control-center
    swarmageddon.dev/component: control-center
  name: control-center
  namespace: swarmageddon-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swarmageddon-platform
      podSelector:
        matchLabels:
          swarmageddon.dev/component: forgejo
    - namespaceSelector:
        matchExpressions:
        - key: swarmageddon.dev/workspace
          operator: DoesNotExist
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
          - swarmageddon-platform
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-center
  policyTypes:
  - Ingress
