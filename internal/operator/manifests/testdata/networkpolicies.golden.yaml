---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: swarmageddon-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: swarmageddon-platform
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: swarmageddon.dev/component
          operator: In
          values:
          - forgejo
          - gateway
          - postgres-bootstrap
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swarmageddon-system
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      swarmageddon.dev/component: postgres
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo
  namespace: swarmageddon-platform
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: swarmageddon.dev/workspace
          operator: Exists
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swarmageddon-system
    ports:
    - port: 3000
      protocol: TCP
    - port: 2222
      protocol: TCP
  podSelector:
    matchLabels:
      swarmageddon.dev/component: forgejo
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messaging
  namespace: swarmageddon-platform
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: swarmageddon.dev/workspace
          operator: Exists
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swarmageddon-system
    ports:
    - port: 8443
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swarmageddon-system
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          swarmageddon.dev/component: messaging
    ports:
    - port: 6222
      protocol: TCP
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      swarmageddon.dev/component: messaging
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: swarmageddon-platform
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: swarmageddon.dev/workspace
          operator: Exists
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swarmageddon-system
    ports:
    - port: 4000
      protocol: TCP
  podSelector:
    matchLabels:
      swarmageddon.dev/component: gateway
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-cache
  namespace: swarmageddon-platform
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: swarmageddon.dev/workspace
          operator: Exists
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swarmageddon-system
    ports:
    - port: 5000
      protocol: TCP
  podSelector:
    matchLabels:
      swarmageddon.dev/component: registry-cache
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ntfy
  namespace: swarmageddon-platform
spec:
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      swarmageddon.dev/component: ntfy
  policyTypes:
  - Ingress
