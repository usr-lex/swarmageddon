---
apiVersion: v1
data:
  config.yaml: |-
    general_settings:
      database_url: os.environ/DATABASE_URL
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      drop_params: true
      telemetry: false
      turn_off_message_logging: true
    model_list:
    - litellm_params:
        api_key: os.environ/PROVIDER_ANTHROPIC_API_KEY
        model: anthropic/claude-opus-5-5
      model_name: claude-opus-5-5
    - litellm_params:
        api_base: http://10.0.0.9:8000/v1
        api_key: none
        model: openai/qwen
      model_name: qwen
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: litellm
    swarmageddon.dev/component: litellm
  name: gateway-config
  namespace: swarmageddon-platform
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: litellm
    swarmageddon.dev/component: litellm
  name: litellm
  namespace: swarmageddon-platform
spec:
  ports:
  - name: http
    port: 4000
    targetPort: 4000
  selector:
    swarmageddon.dev/component: litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: litellm
    swarmageddon.dev/component: litellm
  name: litellm
  namespace: swarmageddon-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      swarmageddon.dev/component: litellm
  template:
    metadata:
      annotations:
        swarmageddon.dev/config-hash: c9c5b2326b
      labels:
        app.kubernetes.io/name: litellm
        swarmageddon.dev/component: litellm
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --config
        - /etc/litellm/config.yaml
        - --port
        - "4000"
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: masterKey
              name: gateway-master
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: postgres-gateway
        - name: LITELLM_LOG
          value: INFO
        - name: LITELLM_TELEMETRY
          value: "False"
        - name: PROVIDER_ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: apiKey
              name: anthropic-key
        image: ghcr.io/berriai/litellm-database:v1.105.1@sha256:2bcadb9905b692a5ca4dadd51bccaaa23a95dc8a0f9322d9c9787f0ac2aeb50e
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        name: litellm
        ports:
        - containerPort: 4000
          name: http
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/litellm
          name: config
          readOnly: true
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: gateway-config
        name: config
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: warden
  namespace: swarmageddon-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: swarmageddon-warden
rules:
- apiGroups:
  - swarmageddon.dev
  resources:
  - rooms
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: swarmageddon-warden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: swarmageddon-warden
subjects:
- kind: ServiceAccount
  name: warden
  namespace: swarmageddon-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: warden
  namespace: swarmageddon-platform
rules:
- apiGroups:
  - ""
  resourceNames:
  - warden-keys
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: warden
  namespace: swarmageddon-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warden
subjects:
- kind: ServiceAccount
  name: warden
  namespace: swarmageddon-platform
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: gateway
  namespace: swarmageddon-platform
spec:
  ports:
  - name: http
    port: 4000
    targetPort: 4000
  selector:
    swarmageddon.dev/component: warden
  sessionAffinity: ClientIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: warden
  namespace: swarmageddon-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      swarmageddon.dev/component: warden
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: gateway
    swarmageddon.dev/component: warden
  name: warden
  namespace: swarmageddon-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      swarmageddon.dev/component: warden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        swarmageddon.dev/component: warden
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  swarmageddon.dev/component: warden
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - --listen=:4000
        - --health=:8080
        - --upstream=http://litellm.swarmageddon-platform.svc:4000
        - --namespace=swarmageddon-platform
        - --messaging-url=https://messaging.swarmageddon-platform.svc:8443
        - --client-cert=/etc/warden/tls/tls.crt
        - --client-key=/etc/warden/tls/tls.key
        - --ca=/etc/warden/tls/ca.crt
        - --review-key-file=/etc/warden/review/key
        image: ghcr.io/usr-lex/swarmageddon/warden:v0.1.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 20
        name: warden
        ports:
        - containerPort: 4000
          name: http
        - containerPort: 8080
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/warden/tls
          name: tls
          readOnly: true
        - mountPath: /etc/warden/review
          name: review
          readOnly: true
      enableServiceLinks: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: warden
      volumes:
      - name: tls
        secret:
          secretName: warden-client
      - name: review
        secret:
          optional: true
          secretName: warden-review
