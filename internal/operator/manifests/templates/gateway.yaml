apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: gateway, app.kubernetes.io/name: gateway}
data:
  config.yaml: |
{{ indent 4 .Gateway.Config }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: gateway, app.kubernetes.io/name: gateway}
spec:
  selector: {swarmageddon.dev/component: gateway}
  ports:
    - {name: http, port: 4000, targetPort: 4000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: gateway, app.kubernetes.io/name: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {swarmageddon.dev/component: gateway}
  template:
    metadata:
      labels: {swarmageddon.dev/component: gateway, app.kubernetes.io/name: gateway}
      annotations:
        swarmageddon.dev/config-hash: {{ .Gateway.ConfigHash }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: litellm
          image: {{ .Images.LiteLLM }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: gateway-master, key: masterKey}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: postgres-gateway, key: url}}
            - {name: LITELLM_LOG, value: INFO}
            - {name: LITELLM_TELEMETRY, value: "False"}
{{- range .Gateway.Providers }}
{{- if .SecretName }}
            - name: {{ .EnvVar }}
              valueFrom: {secretKeyRef: {name: {{ .SecretName }}, key: apiKey}}
{{- end }}
{{- end }}
          ports:
            - {name: http, containerPort: 4000}
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm, readOnly: true}
      volumes:
        - name: config
          configMap: {name: gateway-config}
