apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: litellm, app.kubernetes.io/name: litellm}
data:
  config.yaml: |
{{ indent 4 .Gateway.Config }}
---
# LiteLLM, reached only by the warden and the system namespace's admin callers.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: litellm, app.kubernetes.io/name: litellm}
spec:
  selector: {swarmageddon.dev/component: litellm}
  ports:
    - {name: http, port: 4000, targetPort: 4000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: litellm, app.kubernetes.io/name: litellm}
spec:
  replicas: 1
  selector:
    matchLabels: {swarmageddon.dev/component: litellm}
  template:
    metadata:
      labels: {swarmageddon.dev/component: litellm, app.kubernetes.io/name: litellm}
      annotations:
        swarmageddon.dev/config-hash: {{ .Gateway.ConfigHash }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: litellm
          image: {{ .Images.LiteLLM }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: gateway-master, key: masterKey}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: postgres-gateway, key: url}}
            - {name: LITELLM_LOG, value: INFO}
            - {name: LITELLM_TELEMETRY, value: "False"}
{{- range .Gateway.Providers }}
{{- if .SecretName }}
            - name: {{ .EnvVar }}
              valueFrom: {secretKeyRef: {name: {{ .SecretName }}, key: apiKey}}
{{- end }}
{{- end }}
{{- range .Gateway.Env }}
            - {name: {{ quote .Name }}, value: {{ quote .Value }}}
{{- end }}
          ports:
            - {name: http, containerPort: 4000}
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm, readOnly: true}
      volumes:
        - name: config
          configMap: {name: gateway-config}
---
# The warden (ADR 0011): the gateway guard in front of LiteLLM. Service
# gateway selects its pods, which carry app.kubernetes.io/name=gateway so
# room NetworkPolicies reach them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
automountServiceAccountToken: true
---
# Quarantine only: set Room.spec.quarantined and its annotations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmageddon-warden
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
rules:
  - apiGroups: [swarmageddon.dev]
    resources: [rooms]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarmageddon-warden
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: swarmageddon-warden}
subjects:
  - {kind: ServiceAccount, name: warden, namespace: {{ .Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [warden-keys]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: warden}
subjects:
  - {kind: ServiceAccount, name: warden, namespace: {{ .Namespace }}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
spec:
  selector: {swarmageddon.dev/component: warden}
  # A room's requests reach one replica, which keeps its scoring state.
  sessionAffinity: ClientIP
  ports:
    - {name: http, port: 4000, targetPort: 4000}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: warden
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {swarmageddon.dev/component: warden}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {swarmageddon.dev/component: warden}
  template:
    metadata:
      labels: {swarmageddon.dev/component: warden, app.kubernetes.io/name: gateway}
{{- template "sentry-annotations" . }}
    spec:
      serviceAccountName: warden
      enableServiceLinks: false
      securityContext: {runAsUser: 65532, runAsGroup: 65532, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {swarmageddon.dev/component: warden}
      containers:
        - name: warden
          image: {{ .Images.Warden }}
          args:
            - --listen=:4000
            - --health=:8080
            - --upstream=http://litellm.{{ .Namespace }}.svc:4000
            - --namespace={{ .Namespace }}
            - --messaging-url=https://messaging.{{ .Namespace }}.svc:8443
            - --client-cert=/etc/warden/tls/tls.crt
            - --client-key=/etc/warden/tls/tls.key
            - --ca=/etc/warden/tls/ca.crt
            - --review-key-file=/etc/warden/review/key
{{- if .Sentry.Hash }}
          env:{{ template "sentry-env" . }}
{{- end }}
          ports:
            - {name: http, containerPort: 4000}
            - {name: health, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tls, mountPath: /etc/warden/tls, readOnly: true}
            - {name: review, mountPath: /etc/warden/review, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: warden-client}
        - name: review
          secret: {secretName: warden-review, optional: true}
