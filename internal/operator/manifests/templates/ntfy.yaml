apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: ntfy, app.kubernetes.io/name: ntfy}
spec:
  selector: {swarmageddon.dev/component: ntfy}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntfy
  namespace: {{ .Namespace }}
  labels: {swarmageddon.dev/component: ntfy, app.kubernetes.io/name: ntfy}
spec:
  replicas: 1
  serviceName: ntfy
  selector:
    matchLabels: {swarmageddon.dev/component: ntfy}
  template:
    metadata:
      labels: {swarmageddon.dev/component: ntfy, app.kubernetes.io/name: ntfy}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000, runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ntfy
          image: {{ .Images.Ntfy }}
          args: [serve]
          env:
            - {name: NTFY_BASE_URL, value: {{ quote .Ntfy.BaseURL }}}
            - {name: NTFY_LISTEN_HTTP, value: ":8080"}
            - {name: NTFY_CACHE_FILE, value: /var/cache/ntfy/cache.db}
            - {name: NTFY_BEHIND_PROXY, value: "true"}
            # Nobody reads or publishes without credentials; the operator
            # provisions an admin with a token (Secret ntfy-auth, copied to
            # ntfy-publisher in the system namespace for the control center).
            - {name: NTFY_AUTH_FILE, value: /var/cache/ntfy/user.db}
            - {name: NTFY_AUTH_DEFAULT_ACCESS, value: deny-all}
            - name: NTFY_AUTH_USERS
              valueFrom: {secretKeyRef: {name: ntfy-auth, key: users}}
            - name: NTFY_AUTH_TOKENS
              valueFrom: {secretKeyRef: {name: ntfy-auth, key: tokens}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /v1/health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/cache/ntfy}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Ntfy.Storage }}}
