# Docker Hub is pulled through the platform's registry cache
# (docs/conventions.md). If the cache is down, Podman falls back to docker.io.
unqualified-search-registries = ["docker.io"]
short-name-mode = "permissive"

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "registry-cache.swarmageddon-platform.svc:5000"
insecure = true
