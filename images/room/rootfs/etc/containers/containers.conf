# Podman engine settings for rooms and runners (ADR 0001). The same settings
# as the upstream podman-in-a-container images, except that containers get
# their own network namespace so compose networks work.
[containers]
# The pod's cgroup isn't delegated to us and there is no systemd, so nested
# containers share the room's cgroup (and its limits).
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
# `podman system service` stays up without clients.
service_timeout = 0

[network]
network_backend = "netavark"
