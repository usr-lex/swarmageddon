# Podman storage for the room (ADR 0001). Podman runs as root inside the pod's
# user namespace; /var/lib/containers is the room's engine volume.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
# Kernel overlayfs works inside a user namespace on Linux >= 5.13. Where it
# does not (older kernels, some volume filesystems), use fuse-overlayfs:
# mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev"
