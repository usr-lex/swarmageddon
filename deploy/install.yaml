# Source: swarmageddon/templates/control-center.yaml
# The control center. The operator creates its certificates at startup; the
# Secret volumes are optional so the pod starts first, and kubelet fills them
# in once they exist. The control center waits for its files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-center
  namespace: swarmageddon-system
  labels:
    app.kubernetes.io/part-of: swarmageddon
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: swarmageddon-0.1.0
    app.kubernetes.io/name: control-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-center
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: swarmageddon
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
        helm.sh/chart: swarmageddon-0.1.0
        app.kubernetes.io/name: control-center
    spec:
      serviceAccountName: control-center
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-center
          image: ghcr.io/usr-lex/swarmageddon/control-center:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8443
            - --health=:8080
            - --tls-cert=/etc/swarm/tls/tls.crt
            - --tls-key=/etc/swarm/tls/tls.key
            - --messaging-url=https://messaging.swarmageddon-platform.svc:8443
            - --client-cert=/etc/swarm/client/tls.crt
            - --client-key=/etc/swarm/client/tls.key
            - --ca=/etc/swarm/ca/ca.crt
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /etc/swarm/tls
              readOnly: true
            - name: client
              mountPath: /etc/swarm/client
              readOnly: true
            - name: ca
              mountPath: /etc/swarm/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: control-center-tls
            optional: true
        - name: client
          secret:
            secretName: control-center-client
            optional: true
        - name: ca
          configMap:
            name: platform-ca-bundle
            optional: true
        - name: tmp
          emptyDir: {}
