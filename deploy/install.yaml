            type: string
          metadata:
            type: object
          spec:
            description: |-
              RoleTemplateSpec is a persona: role text plus CLI policy. Personas are
              guardrails, not security (docs/design.md §6.4).
            properties:
              advisor:
                description: 'Advisor the agent can consult with `swarm advise` (ADR
                  0010). No model: no advisor.'
                properties:
                  effort:
                    type: string
                  maxCallsPerHour:
                    default: 10
                    format: int32
                    type: integer
                  model:
                    description: Model, as the gateway names it.
                    type: string
                  monthlyUSD:
                    description: 'Monthly budget of the advisor''s own gateway key
                      in USD; 0: the workspace''s per-room budget.'
                    format: int32
                    type: integer
                  native:
                    description: Native also turns on Claude Code's built-in advisor
                      tool (Claude rooms only; unauditable).
                    type: boolean
                required:
                - model
                type: object
              autoApprove:
                description: AutoApprove rules the control center applies to approval
                  requests.
                items:
                  properties:
                    decision:
                      default: allow
                      description: ApprovalDecision is what an automatic rule answers.
                      enum:
                      - allow
                      - deny
                      type: string
                    match:
                      description: Match is a regular expression against the command
                        or file path.
                      type: string
                    tool:
                      description: 'Tool name (Claude: Bash, Edit, ...; ore: exec,
                        patch). "*" for any.'
                      type: string
                  required:
                  - tool
                  type: object
                type: array
              claudeCode:
                properties:
                  allow:
                    items:
                      type: string
                    type: array
                  deny:
                    items:
                      type: string
                    type: array
                  hooks:
                    description: Hooks in Claude Code's settings.json format, added
                      after the platform's own.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  managedRulesOnly:
                    description: ManagedRulesOnly sets allowManagedPermissionRulesOnly.
                    type: boolean
                  permissionMode:
                    description: PermissionMode is Claude Code's permission mode.
                    enum:
                    - default
                    - acceptEdits
                    - auto
                    - plan
                    - bypassPermissions
                    type: string
                type: object
              firstTurn:
                description: 'FirstTurn is the prompt a room gets when it starts.
                  Empty: the built-in one.'
                type: string
              forgeTeams:
                description: ForgeTeams the room's forge user joins (implementers,
                  reviewers, mergers, ci).
                items:
                  type: string
                type: array
              ore:
                properties:
                  approvalPolicy:
                    default: on-request
                    description: OreApprovalPolicy is ore's approval_policy.
                    enum:
                    - on-request
                    - on-failure
                    - never
                    type: string
                  approvalsReviewer:
                    default: user
                    enum:
                    - user
                    - auto_review
                    type: string
                  bypass:
                    description: Bypass runs ore without approvals or sandbox.
                    type: boolean
                  mcpTools:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: 'MCPTools: per server, the tools enabled. Empty:
                      all.'
                    type: object
                  rules:
                    description: Rules in execpolicy syntax (prefix_rule(...)), one
                      file.
                    type: string
                  sandboxMode:
                    description: 'SandboxMode: read-only, workspace-write or danger-full-access.'
                    type: string
                type: object
              roleText:
                description: RoleText is written to the agent.
                type: string
              roomDefaults:
                description: RoomDefaults apply to rooms of this role, over the workspace's
                  (docs/design.md §6.6).
                properties:
                  env:
                    additionalProperties:
                      type: string
                    description: Env adds non-secret environment variables.
                    type: object
                  mcpServers:
                    additionalProperties:
                      description: MCPServer is one MCP server, as in .mcp.json.
                      properties:
                        args:
                          items:
                            type: string
                          type: array
                        command:
                          type: string
                        disabled:
                          description: Disabled removes a server inherited from an
                            earlier level.
                          type: boolean
                        enabledTools:
                          description: 'EnabledTools limits the server''s tools; empty:
                            all.'
                          items:
                            type: string
                          type: array
                        env:
                          additionalProperties:
                            description: MCPValue is a literal value, or one taken
                              from a Secret.
                            properties:
                              value:
                                type: string
                              valueFrom:
                                description: SecretKeyRef names a key of a Secret
                                  in the workspace namespace.
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            type: object
                          type: object
                        headers:
                          additionalProperties:
                            description: MCPValue is a literal value, or one taken
                              from a Secret.
                            properties:
                              value:
                                type: string
                              valueFrom:
                                description: SecretKeyRef names a key of a Secret
                                  in the workspace namespace.
                                properties:
                                  key:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            type: object
                          type: object
                        type:
                          description: stdio (default when command is set) or http.
                          enum:
                          - stdio
                          - http
                          type: string
                        url:
                          type: string
                      type: object
                    description: MCPServers for both CLIs, by name, in the .mcp.json
                      format.
                    type: object
                  network:
                    description: Network is the room's network access (docs/design.md
                      §11.2).
                    properties:
                      domains:
                        description: |-
                          Domains reachable in limited mode: exact hosts or *.suffix, with an
                          optional :port (default 443 and 80). Merged across levels.
                        items:
                          type: string
                        type: array
                      mode:
                        description: Mode; empty inherits the earlier level's, and
                          full when no level sets it.
                        enum:
                        - none
                        - limited
                        - full
                        type: string
                      packageManagers:
                        description: PackageManagers adds the package registries'
                          domains in limited mode.
                        type: boolean
                    type: object
                  secretEnv:
                    description: |-
                      SecretEnv adds environment variables whose values come from Secrets in
                      the workspace namespace.
                    items:
                      description: SecretEnvVar is an environment variable whose value
