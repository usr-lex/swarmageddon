# read and change only these; the operator's Role control-center-owned adds
# the ones it created with a per-provider, per-channel or per-workspace
# name. Its certificates are mounted, not read through the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-center
  namespace: swarmageddon-system
  labels:
    app.kubernetes.io/part-of: swarmageddon
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: swarmageddon-0.1.0
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - setup-token
      - local-admin
      - control-center-session
      - control-center-db
      - vapid
      - control-center-saml
      - control-center-gateway
      - forge-reader
      - ntfy-publisher
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [platform-ca-bundle]
    verbs: [get]
