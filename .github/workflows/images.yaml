# Builds every image natively per architecture (no QEMU), then joins the
# per-arch tags into multi-arch manifests. Called by ci.yaml and release.yaml.
name: images

on:
  workflow_call:
    inputs:
      version:
        description: Image tag
        required: true
        type: string
      push:
        description: Push to the registry
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/usr-lex/swarmageddon

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # The room and runner images are large; the amd64 runner ran out of
      # disk building the Go images after them.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The default docker driver: the runner image builds FROM the room
      # image just built, which only that driver sees without pushing.
      - name: Build${{ inputs.push && ' and push' || '' }}
        run: |
          make images \
            REGISTRY="$REGISTRY" \
            VERSION=${{ inputs.version }}-${{ matrix.arch }} \
            PLATFORMS=linux/${{ matrix.arch }} \
            IMAGE_OUTPUT=--load
          if [ "${{ inputs.push }}" = true ]; then
            for i in room runner operator control-center messaging warden egress mockmodel devices; do
              docker push "$REGISTRY/$i:${{ inputs.version }}-${{ matrix.arch }}"
            done
          fi
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep swarmageddon

  manifest:
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch manifests
        run: |
          v=${{ inputs.version }}
          for i in room runner operator control-center messaging warden egress mockmodel devices; do
            docker buildx imagetools create -t "$REGISTRY/$i:$v" \
              "$REGISTRY/$i:$v-amd64" "$REGISTRY/$i:$v-arm64"
          done
