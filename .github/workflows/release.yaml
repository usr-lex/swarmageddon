# On a version tag (v1.2.3): multi-arch images, the chart as an OCI artifact,
# and a GitHub release with install.yaml and install.sh attached.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    uses: ./.github/workflows/images.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      push: true
    secrets: inherit

  release:
    needs: [version, images]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Set the chart's version
        run: |
          sed -i "s/^version: .*/version: $VERSION/; s/^appVersion: .*/appVersion: \"$VERSION\"/" charts/swarmageddon/Chart.yaml
      - name: Render install.yaml and package the chart
        run: |
          make install-yaml chart HELM="$(command -v helm)"
          cp deploy/install.yaml install.sh dist/
      - name: Push the chart to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/swarmageddon-$VERSION.tgz" oci://ghcr.io/usr-lex/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/install.yaml dist/install.sh "dist/swarmageddon-$VERSION.tgz"
