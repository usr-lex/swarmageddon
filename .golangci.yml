version: "2"
linters:
  settings:
    errcheck:
      # Closing a response body or writing to stdout/stderr: nothing useful
      # to do with the error.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*net/http.Response).Body.Close
  exclusions:
    rules:
      # A bare receive from an error channel waits for a goroutine to end;
      # the error was already handled where it was sent.
      - linters: [errcheck]
        text: "^Error return value is not checked"
      # Tests may ignore errors from cleanup helpers.
      - path: _test\.go
        linters: [errcheck]
